name: Publicar no GitHub Pages

# A cada push na branch main (ou manualmente, pela aba Actions), o app é compilado
# a partir dos .md e publicado em https://<usuario>.github.io/<repositorio>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outro push, cancela a anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estudo-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: estudo-app/package-lock.json

      - run: npm ci

      # "npm run build" roda antes o gerador (.md -> conteudo.gerado.ts).
      # O base-href é o nome do repositório, pois o site fica em /<repositorio>/.
      - name: Compilar
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # O GitHub Pages serve 404.html para caminhos que não existem; com uma cópia do
      # index.html ali, links diretos como /disciplina/ti abrem o app normalmente.
      - name: Fallback das rotas (404.html)
        run: cp dist/estudo-app/browser/index.html dist/estudo-app/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: estudo-app/dist/estudo-app/browser

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
